volumes:
  local_postgres18_data: {}
  local_postgres18_data_backups: {}

services:
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: rard_local_django
    pull_policy: never
    container_name: django
    platform: linux/x86_64
    depends_on:
      - postgres
    links:
      - postgres
    volumes:
      - .:/app
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - "8000:8000"
      - "8012:8012"
    command: /start

  postgres:
    image: postgres:18.6-alpine3.24
    pull_policy: never
    container_name: postgres
    platform: linux/x86_64
    volumes:
      - local_postgres18_data:/var/lib/postgresql/18/docker
      - local_postgres18_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres

  docs:
    image: rard_local_docs
    container_name: docs
    platform: linux/x86_64
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    pull_policy: never
    env_file:
      - ./.envs/.local/.django
    volumes:
      - ./docs:/docs
      - ./config:/app/config
      - ./rard:/app/rard
    ports:
      - "9000:9000"
